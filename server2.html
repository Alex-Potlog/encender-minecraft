<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encender servidor de invierno</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    button { padding: .6rem 1rem; cursor: pointer; }
    button:disabled { cursor: wait; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Encender servidor de invierno</h1>
  <button id="start">Encender server</button>
  <p id="status"></p>
  <p><a href="index.html">Volver a la página de servidores</a></p>

  <script>
    const ENDPOINT = "https://rba04gz802.execute-api.eu-south-2.amazonaws.com/start/invierno";
    const button = document.getElementById("start");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Solicitando encendido...";
      try {
        const response = await fetch(ENDPOINT, { method: "PUT" });
        const message = await response.text();
        if (!response.ok) throw new Error(`Error HTTP ${response.status}${message ? `: ${message}` : ""}`);
        status.textContent = message || "Solicitud de encendido enviada.";
      } catch (error) {
        status.textContent = `No se pudo encender el servidor: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
