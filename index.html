<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f1e8">
  <title>Encender servidores</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f1e8;
      --surface: #fffdf8;
      --surface-highlight: #e8eee2;
      --border: #d8ddcf;
      --text: #29382c;
      --muted: #687365;
      --accent: #58734d;
      --accent-dark: #fffdf8;
      --error: #a4473d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      color: var(--text);
      background: var(--background);
    }

    .page {
      width: min(680px, 100%);
      margin: 0 auto;
    }

    .intro { margin-bottom: 28px; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: -.05em;
      line-height: 1.1;
    }

    .subtitle {
      max-width: 46ch;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.6;
    }

    #servers { display: grid; gap: 14px; }

    .server {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 8px 22px rgba(58, 65, 48, .07);
      transition: border-color .2s ease, transform .2s ease;
    }

    .server:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .server-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .server h2 { margin: 0; font-size: 1.25rem; }

    .server-description {
      margin: 8px 0 18px;
      color: var(--muted);
      line-height: 1.55;
    }

    .tag {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-highlight);
      color: var(--accent);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    button {
      min-height: 44px;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: var(--accent-dark);
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease, opacity .2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      background: #435d3a;
    }

    button:focus-visible {
      outline: 3px solid #9a7956;
      outline-offset: 3px;
    }

    button:disabled { cursor: wait; opacity: .65; }

    .status {
      min-height: 1.5em;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: .94rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .status.success { color: var(--accent); }
    .status.error { color: var(--error); }

    @media (max-width: 480px) {
      body { padding: 32px 16px; }
      .server { padding: 18px; }
      button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">Minecraft · Panel de control</p>
      <h1>Encender servidores</h1>
      <p class="subtitle">Elige un mundo para iniciar. Te avisaremos cuando esté listo para jugar.</p>
    </header>
    <div id="servers"></div>
  </main>

  <script>
    const SERVERS = [
      {
        name: "Mods",
        description: "Un mundo para explorar Minecraft con mods y descubrir nuevas formas de jugar.",
        endpoint: "https://rba04gz802.execute-api.eu-south-2.amazonaws.com/start/mods"
      },
      {
        name: "Invierno",
        description: "Un mundo de ambiente invernal para construir y aventurarse entre paisajes nevados.",
        endpoint: "https://rba04gz802.execute-api.eu-south-2.amazonaws.com/start/invierno"
      }
    ];

    const root = document.getElementById("servers");

    for (const server of SERVERS) {
      const section = document.createElement("section");
      section.className = "server";

      const header = document.createElement("div");
      header.className = "server-header";

      const title = document.createElement("h2");
      title.textContent = server.name;

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "Minecraft";

      const description = document.createElement("p");
      description.className = "server-description";
      description.textContent = server.description;

      const button = document.createElement("button");
      button.textContent = "Encender servidor";

      const status = document.createElement("p");
      status.className = "status";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");

      header.append(title, tag);
      section.append(header, description, button, status);
      root.append(section);

      async function call(action, password) {
        const response = await fetch(server.endpoint, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, action })
        });
        if (!response.ok) throw new Error(`Error HTTP ${response.status}`);
        return response.json();
      }

      async function poll(password) {
        try {
          const data = await call("status", password);
          if (data.ready) {
            status.textContent = `Listo: ${data.ip}:25565`;
            status.className = "status success";
            button.disabled = false;
          } else {
            status.textContent = `Estado: ${data.state || "iniciando"}... (Forge puede tardar 1-3 min)`;
            setTimeout(() => poll(password), 5000);
          }
        } catch (error) {
          status.textContent = `No se pudo consultar el estado: ${error.message}`;
          status.className = "status error";
          button.disabled = false;
        }
      }

      button.addEventListener("click", async () => {
        const password = prompt("Contraseña:");
        if (!password) return;

        button.disabled = true;
        status.className = "status";
        status.textContent = "Solicitando encendido...";

        try {
          const data = await call("start", password);
          status.textContent = data.message || "Solicitud enviada.";
          if (data.state === "pending" || data.state === "running") {
            poll(password);
          } else {
            button.disabled = false;
          }
        } catch (error) {
          status.textContent = `No se pudo encender el servidor: ${error.message}`;
          status.className = "status error";
          button.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
