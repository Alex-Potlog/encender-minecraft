<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encender servidores</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
    .server { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    button { padding: .6rem 1rem; cursor: pointer; }
    button:disabled { cursor: wait; }
    .status { min-height: 1.5em; }
  </style>
</head>
<body>
  <h1>Encender servidores</h1>
  <p>Añade servidores al array <code>SERVERS</code> para mostrarlos aquí.</p>
  <main id="servers"></main>
  <p><a href="server2.html">Página del otro servidor</a></p>

  <script>
    // Para añadir otro servidor, agrega un objeto con nombre y endpoint.
    const SERVERS = [
      {
        name: "Mods",
        endpoint: "https://rba04gz802.execute-api.eu-south-2.amazonaws.com/start/mods"
      }
    ];

    const root = document.getElementById("servers");

    for (const server of SERVERS) {
      const section = document.createElement("section");
      section.className = "server";
      const title = document.createElement("h2");
      title.textContent = server.name;
      const button = document.createElement("button");
      button.textContent = "Encender server";
      const status = document.createElement("p");
      status.className = "status";
      section.append(title, button, status);
      root.append(section);

      async function call(action, password) {
        const response = await fetch(server.endpoint, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password, action })
        });
        if (!response.ok) throw new Error(`Error HTTP ${response.status}`);
        return response.json();
      }

      async function poll(password) {
        try {
          const data = await call("status", password);
          if (data.ready) {
            status.textContent = `Listo: ${data.ip}:25565`;
            button.disabled = false;
          } else {
            status.textContent = `Estado: ${data.state || "iniciando"}... (Forge puede tardar 1-3 min)`;
            setTimeout(() => poll(password), 5000);
          }
        } catch (error) {
          status.textContent = `No se pudo consultar el estado: ${error.message}`;
          button.disabled = false;
        }
      }

      button.addEventListener("click", async () => {
        const password = prompt("Contraseña:");
        if (!password) return;
        button.disabled = true;
        status.textContent = "Solicitando encendido...";
        try {
          const data = await call("start", password);
          status.textContent = data.message || "Solicitud enviada.";
          if (data.state === "pending" || data.state === "running") {
            poll(password);
          } else {
            button.disabled = false;
          }
        } catch (error) {
          status.textContent = `No se pudo encender el servidor: ${error.message}`;
          button.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
